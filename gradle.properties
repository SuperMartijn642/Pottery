# Gradle settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft
minecraft_version=26.2
minecraft_dependency=[26.2,26.3)
minecraft_suffix=mc26.2
java_target=25
java_dependency=>=25

# NeoForge
neoforge_version=26.2.0.7-beta
neoforge_dependency=*
javafml_dependency=[1,)

# Mixin
mixin_minimum_version=0.8
mixin_package=mixin
mixin_compatibility_level=JAVA_17

# Mod properties
mod_name=Pottery
mod_description=Pottery adds new decorative pots!
mod_id=pottery
mod_version=1.0.2
mod_license=All rights reserved
mod_page=https://www.curseforge.com/minecraft/mc-mods/pottery
mod_sources=https://github.com/SuperMartijn642/Pottery
mod_issues=https://github.com/SuperMartijn642/Pottery/issues
mod_package=com.supermartijn642.pottery
mod_main_class=Pottery
maven_group=com.supermartijn642

# Publishing
publishing_release_type=stable
publishing_game_versions=26.2
curseforge_project_id=955781
curseforge_required_dependency_ids=supermartijn642s-core-lib supermartijn642s-config-lib
curseforge_optional_dependency_ids=
modrinth_project_id=iiuzmkWd
modrinth_required_dependency_ids=supermartijn642s-core-lib supermartijn642s-config-lib
modrinth_optional_dependency_ids=

# Dependencies
core_library_file=8370850
core_library_dependency=>=1.1.17 <1.2.0
config_library_file=8306685
